# The core profile: object storage, catalog database, query engine, BI.
#
#   docker compose --profile core up -d
#
# Layer 2 (Redpanda + Spark) will arrive as a separate profile so an 8 GB
# machine can still run layer 1 — SPEC.md section 1 sets that as a constraint,
# not an aspiration.
#
# Every service declares a healthcheck, and every dependent service waits on
# it. Trino cannot create a catalog table before PostgreSQL accepts
# connections, and a stack that starts in the wrong order fails in ways that
# look like configuration errors.
#
# Credentials come from .env (see .env.example). None are committed.

name: hugin

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["core"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hugin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-before-first-run}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -fsS http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # One-shot: create the bucket Trino writes its warehouse into. Idempotent,
  # so `up` twice is not an error.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: ["core"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hugin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-before-first-run}
      MINIO_BUCKET: ${MINIO_BUCKET:-hugin-lakehouse}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      echo 'bucket ready: '$$MINIO_BUCKET
      "

  postgres:
    image: postgis/postgis:16-3.4
    profiles: ["core"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hugin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-first-run}
      # Two databases in one instance: the Iceberg JDBC catalog, and later
      # Airflow's metadata. ADR 001 chose the JDBC catalog precisely so this
      # is a schema rather than another service to run.
      POSTGRES_DB: ${POSTGRES_DB:-iceberg}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-hugin} -d $${POSTGRES_DB:-iceberg}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  trino:
    image: trinodb/trino:476
    profiles: ["core"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./docker/trino/catalog:/etc/trino/catalog:ro
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hugin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-before-first-run}
      POSTGRES_USER: ${POSTGRES_USER:-hugin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-first-run}
    healthcheck:
      # /v1/info reports starting=false only once the coordinator will accept
      # queries. Checking the port alone reports healthy while every query
      # still fails with SERVER_STARTING_UP.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v1/info | grep -q '\"starting\":false'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  metabase:
    image: metabase/metabase:v0.54.5
    profiles: ["core"]
    depends_on:
      trino:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${METABASE_DB:-metabase}
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER:-hugin}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-change-me-before-first-run}
      MB_DB_HOST: postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health | grep -q '\"status\":\"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s

  # --- Airflow -------------------------------------------------------------
  # LocalExecutor, metadata in the PostgreSQL this stack already runs. SPEC.md
  # section 1 picks LocalExecutor deliberately: Celery would add a broker and a
  # worker fleet to demonstrate the same scheduling.
  airflow-init:
    build: ./docker/airflow
    profiles: ["core"]
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${POSTGRES_USER:-hugin}:${POSTGRES_PASSWORD:-change-me-before-first-run}@postgres:5432/${AIRFLOW_DB:-airflow}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/hugin/orchestration/dags
      PYTHONPATH: /opt/hugin/src
      # The pipeline reads these through hugin.common.config.
      REPLAY_EPOCH: ${REPLAY_EPOCH:-2026-08-01T00:00:00Z}
      REPLAY_SPEED: ${REPLAY_SPEED:-1}
      SOURCE_MODE: ${SOURCE_MODE:-real}
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hugin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-before-first-run}
    volumes: &airflow-volumes
      - ./orchestration:/opt/hugin/orchestration
      - ./src:/opt/hugin/src
      - ./transform:/opt/hugin/transform
      - ./data:/opt/hugin/data
      - ./quality:/opt/hugin/quality
      - airflow-logs:/opt/airflow/logs
    # One line: a folded YAML scalar joins the lines without the backslashes
    # bash needs, so a multi-line command here becomes several broken ones.
    entrypoint: ["/bin/bash", "-c", "airflow db migrate && (airflow users create --username admin --password admin --firstname hugin --lastname admin --role Admin --email admin@example.invalid || true)"]

  airflow-scheduler:
    build: ./docker/airflow
    profiles: ["core"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      trino:
        condition: service_healthy
    environment: *airflow-env
    volumes: *airflow-volumes
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  airflow-webserver:
    build: ./docker/airflow
    profiles: ["core"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes: *airflow-volumes
    ports:
      - "8081:8080"
    command: webserver
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health | grep -q healthy"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s

  # --- stream profile ------------------------------------------------------
  # Kept out of "core" so an 8 GB machine can still run layer 1. SPEC.md
  # section 1 puts layer 1 at ~6 GB and layer 2 at ~12 GB with it.
  #
  #   docker compose --profile stream up -d
  redpanda:
    image: redpandadata/redpanda:v24.3.6
    profiles: ["stream"]
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
      - --schema-registry-addr=0.0.0.0:8081
    ports:
      - "19092:19092"   # Kafka API from the host
      - "18081:8081"    # schema registry from the host
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      # cluster health, not just a listening port: the broker accepts
      # connections before it will accept a produce.
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s

  spark:
    image: apache/spark:3.5.4-scala2.12-java17-python3-ubuntu
    profiles: ["stream"]
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hugin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-before-first-run}
      POSTGRES_USER: ${POSTGRES_USER:-hugin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-first-run}
      PYTHONPATH: /opt/hugin/src
    volumes:
      - ./src:/opt/hugin/src
      - ./orchestration:/opt/hugin/orchestration
      - ./data:/opt/hugin/data
      - spark-checkpoints:/opt/hugin/checkpoints
    ports:
      - "4040:4040"     # the Spark UI, for watching a micro-batch
    # Idle by default. The streaming job is submitted explicitly, so killing it
    # to prove checkpoint resume does not fight a restart policy.
    command: ["/bin/bash", "-c", "sleep infinity"]

volumes:
  minio-data:
  postgres-data:
  airflow-logs:
  redpanda-data:
  spark-checkpoints:
