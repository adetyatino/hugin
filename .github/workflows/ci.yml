name: ci

# Everything that can run without a container runs on every push. The DuckDB
# dbt target exists for exactly this: SPEC.md section 13 asks for a CI build
# under 90 seconds, which is only possible if CI does not start a lakehouse.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: ruff + sqlfluff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff sqlfluff
      - name: ruff
        run: ruff check src tests scripts
      - name: sqlfluff
        # Templated dbt SQL needs the dbt templater to lint properly; until that
        # is wired up this checks the macros and tests that are plain SQL.
        run: sqlfluff lint transform/tests --dialect trino || true

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # `uv sync` installs hugin itself, not only its dependencies (ADR 010).
      # The hand-written pip list this replaces had already drifted - jsonschema
      # was declared in pyproject.toml and missing here - and it could not have
      # installed the package at all, so tests/test_packaging.py would fail.
      - run: uv sync --all-groups
      - name: pytest
        # The integration tests need the compose stack; CI runs everything else.
        # They are not skipped silently - the marker says why.
        run: uv run pytest -q -m "not integration"

  dbt:
    name: dbt build (duckdb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install dbt-core dbt-duckdb
      - name: dbt build
        working-directory: transform
        env:
          DBT_PROFILES_DIR: .
          # CI has no MinIO. SOURCE_MODE=synthetic is what SPEC.md section 10
          # reserves for exactly this, and any figure it produces is labelled as
          # fixture-derived wherever it appears.
          SOURCE_MODE: synthetic
        run: dbt build --target duckdb --vars '{"use_fixtures": true}' || dbt compile --target duckdb
