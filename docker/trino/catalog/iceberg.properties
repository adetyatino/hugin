# Iceberg on MinIO, catalogued in PostgreSQL over JDBC.
#
# ADR 001 chose the JDBC catalog because it needs no extra service: the
# PostgreSQL instance this stack already runs holds the catalog tables. A Hive
# Metastore or a REST catalog would each be another container to operate.
connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/iceberg_catalog
iceberg.jdbc-catalog.connection-user=${ENV:POSTGRES_USER}
iceberg.jdbc-catalog.connection-password=${ENV:POSTGRES_PASSWORD}
iceberg.jdbc-catalog.catalog-name=hugin
iceberg.jdbc-catalog.default-warehouse-dir=s3://hugin-lakehouse/warehouse

# Registering Parquet already written to object storage, rather than inserting
# it row by row through the engine. This is what makes "write Parquet to MinIO,
# then register as Iceberg" a two-step operation instead of a rewrite.
iceberg.add_files-procedure.enabled=true

# S3 against MinIO: path-style addressing, because virtual-host style needs DNS
# per bucket that a local container does not have.
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}

# Bronze is partitioned by _replay_date, and _replay_date is varchar because
# SPEC.md section 3 forbids bronze from typing anything — so the partitioning is
# identity on a string and a backfill of the field's 3,044 days touches 3,044
# partitions in one INSERT. The default limit of 100 open partition writers
# fails that with ICEBERG_TOO_MANY_OPEN_PARTITIONS. Sorting the insert does not
# help: the write is distributed, so the ordering does not bound how many
# partitions a single writer sees.
#
# The rows are small (a day of production is seven rows), so the memory this
# buys back is negligible. A table where a partition held a gigabyte would want
# chunked loading instead.
iceberg.max-partitions-per-writer=4000
